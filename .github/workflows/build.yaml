name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26, not macos-15: the app calls NSGlassEffectView, which only
    # exists in the macOS 26 SDK. An older image fails at compile time, not at
    # runtime, so this cannot fall back to an older runner without dropping the
    # glass -- see Roost/Monitor/Popup.swift.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
      # Compiler errors are re-printed as annotations because a run's log is
      # only readable when signed in to GitHub, while its annotations are
      # public: this build went red and stayed red with nobody able to see why.
      # pipefail is set by hand: a step's default shell is `bash -e`, without
      # it, so a tee here once reported a failed build as a passing one.
      - run: |
          set -o pipefail
          xcodebuild -scheme Roost -destination 'platform=macOS' -configuration Release archive CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee build.log
      - if: failure()
        run: |
          grep -E ': error: ' build.log | sort -u | head -20 | sed 's/^/::error::/' || true
