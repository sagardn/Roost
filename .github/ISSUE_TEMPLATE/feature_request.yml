name: Feature request
description: Suggest something Roost should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that Roost makes hard?
      description: The problem, not the solution — it often has a simpler fix.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
