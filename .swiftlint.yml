# Roost's lint configuration.
#
# What this replaced was upstream's, and the part of it that was actually
# wrong was the `identifier_name` exception list: all eighteen entries named
# types and variables that do not exist in this app -- SensorsList,
# BatteryInfo, FanValues, _uuidAddress and the rest went with the modules
# they belonged to. A list of exceptions for code that is gone is a list
# nobody can evaluate, so the rule is off instead.
#
# Every disabled rule below says what in this tree trips it, measured rather
# than assumed. CI runs it on every push; locally it is `swiftlint --quiet`
# from the repository root, and a rule switched on without a measurement
# behind it is a guess that turns the build red.

disabled_rules:
  # One site, and it is correct. `WindowControl.element(_:)` compares
  # CFGetTypeID and then casts unconditionally, because `as?` cannot do this
  # job: the compiler rejects a conditional downcast to a CoreFoundation type
  # with "will always succeed" and points at CFGetTypeID instead. The safe
  # spelling here is the one that looks unsafe, so the rule would be telling
  # us to introduce the bug.
  - force_cast
  # MonitorBar.state returns (combined:row:own:) and the disk counters return
  # (total:byDevice:). large_tuple errors at three members, and both of those
  # are deliberate: they are one reading each, destructured at the call site.
  - large_tuple
  # One-character names are right where this app uses them -- `x` and `y` in
  # a drawing loop, `rx`/`tx` for a pair of byte counters. The rule cannot
  # tell those from `let a =` in business logic, and the alternative is the
  # exception list that just died of being unmaintainable.
  - identifier_name
  # These three were off upstream and I cannot measure them without running
  # the linter. Left off rather than switched on untested; a style rule that
  # fails the build on its first run teaches people to ignore the job.
  - type_name
  - cyclomatic_complexity
  - opening_brace
  # Fourteen sites, all one shape: `isOn ? start() : stop()`, a switch
  # handed to the pair of calls it chooses between. That is this codebase's
  # idiom for an on/off setting -- every module shell's `isEnabled` setter
  # uses it -- and an if/else over the same two calls says nothing more.
  - void_function_in_ternary

opt_in_rules:
  - empty_count
  - colon
  - comma
  - control_statement
  - trailing_newline
  - closure_spacing

# 160 leaves room without letting a line grow past what fits beside a diff.
# Ten lines pass it and are left warning, all for one reason: each is an
# English sentence used as a localisation key, the longest 197 columns.
# Splitting one into `"…" + "…"` would hide it from `i18n.py scan`, which
# reads whole literals, so the key would stop being checked.
line_length:
  warning: 160
  error: 200

# A warning once a file passes 900 lines, an error at 1300. LargeFilesWindow
# is the one past the warning, at 1264 -- 36 lines short of failing the build.
# The warning is left showing rather than raised: the next change to that
# file should move a view out of it, and the warning is what says so.
file_length:
  warning: 900
  error: 1300

type_body_length:
  warning: 700
  error: 1000

# The longest function body is Notify.show at 109 lines. 120 warns on the
# next one to grow past it; 200 is the point where it has clearly taken on a
# second job.
function_body_length:
  warning: 120
  error: 200

# Types nested two deep, in three places: WindowRef.Handle in WindowControl,
# DiskReadings.Meter.Sample, and Release.Payload.Asset. Each inner type means
# nothing outside its parent, and nesting is what says so. Two levels allow
# all three and still flag a third.
nesting:
  type_level: 2

# One function takes six: PopupSection's private `series`, which draws one
# side of the traffic chart from values, tint, direction, area, midline and
# peak -- all of them read, none of them a flag. Bundling them into a struct
# for a single private call site would be ceremony.
function_parameter_count:
  warning: 6

excluded:
  - Tools
  - build
